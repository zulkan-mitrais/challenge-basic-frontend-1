<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link href="./output.css" rel="stylesheet">

    <title>Frontend Mentor | Product preview card component</title>

    <style>
        .attribution {
            font-size: 11px;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>
<body>
<div class="bg-color-default min-h-screen flex flex-col justify-center items-center p-[10px]">
        <div class="w-full md:w-[600px] bg-white flex flex-col md:flex-row rounded-xl overflow-hidden shadow-lg">
            <picture class="w-full md:w-[300px] shrink-0">
                <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
                <img src="./images/image-product-mobile.jpg"
                     alt="Gabrielle Essence Eau De Parfum"
                     class="w-full h-[240px] md:h-full object-cover"/>
            </picture>
            <div class="w-full p-6 md:p-7 flex flex-col">
                <div class="text-xs tracking-[0.3em] text-[var(--grey)] uppercase mb-3">
                    Perfume
                </div>

                <h1 class="text-[28px] md:text-[32px] leading-[28px] md:leading-[32px] font-bold mb-4 md:mb-6 font-[Fraunces] text-[var(--black)]">
                    Gabrielle Essence Eau De Parfum
                </h1>

                <p class="text-[14px] text-[var(--grey)] leading-[23px] mb-6 md:mb-7">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                </p>

                <div class="flex items-center gap-4 mb-5 md:mb-7">
                    <span class="text-[32px] font-bold text-[var(--green-500)] font-[Fraunces]">$149.99</span>
                    <span class="text-[13px] text-[var(--grey)] line-through">$169.99</span>
                </div>

                <button class="bg-[var(--green-500)] hover:bg-[var(--green-700)] text-white font-semibold text-[14px] py-[15px] rounded-lg flex items-center justify-center gap-3 w-full transition-colors mt-auto">
                    <img src="./images/icon-cart.svg" alt="" class="w-4 h-4"/>
                    <span>Add to Cart</span>
                </button>
            </div>
        </div>

    <div class="attribution mt-8 text-center px-4">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="#">Zulkan</a>.
    </div>
</div>
</body>
</html>
